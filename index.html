<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make My Bread — Pain au levain</title>
<meta name="description" content="Site coopératif de partage d'expérience sur le pain au levain : levain, farines, plans de production.">
<link rel="stylesheet" href="css/style.css?v=v5">
</head>
<body>
<header class="topbar">
  <h1>🍞 Make My Bread</h1>
  <p class="tagline">Pain au levain — méthode, recettes et expérience partagées</p>
</header>

<main>
  <!-- ============ LEVAIN ============ -->
  <section id="tab-levain" class="tab-panel active" aria-label="Levain">
    <div id="levain-content"></div>
  </section>

  <!-- ============ FARINE ============ -->
  <section id="tab-farine" class="tab-panel" aria-label="Farine">
    <div id="farine-content"></div>
  </section>

  <!-- ============ PLAN ============ -->
  <section id="tab-plan" class="tab-panel" aria-label="Plan">
    <div id="plan-content"></div>
  </section>

  <!-- ============ TECHNIQUES ============ -->
  <section id="tab-techniques" class="tab-panel" aria-label="Techniques">
    <div id="techniques-content"></div>
  </section>

  <!-- ============ RECETTES & SAVOIR ============ -->
  <section id="tab-savoir" class="tab-panel" aria-label="Recettes et savoir">
    <div id="savoir-content"></div>
  </section>
</main>

<button id="chat-fab" class="chat-fab" aria-label="Ouvrir l'assistant" title="Assistant">💬</button>
<div id="chat-panel" class="chat-panel" hidden>
  <div class="chat-header">
    <span class="chat-title">🍞 Assistant pain</span>
    <span class="chat-actions">
      <button id="chat-toggle" aria-label="Réduire / agrandir">–</button>
      <button id="chat-close" aria-label="Fermer">×</button>
    </span>
  </div>
  <div id="chat-log" class="chat-log" aria-live="polite"></div>
  <div class="chat-input-row">
    <input id="chat-input" type="text" placeholder="Ex. ma pâte ne gonfle pas…" aria-label="Votre question">
    <button id="chat-send">Envoyer</button>
  </div>
</div>

<footer>
  <p>MakeMyBread — contenu issu d'expérience réelle. 🍞</p>
</footer>

<script src="js/data.js?v=v5"></script>
<script src="js/levain.js?v=v5"></script>
<script src="js/farine.js?v=v5"></script>
<script src="js/plan.js?v=v5"></script>
<script src="js/savoir.js?v=v5"></script>
<script src="js/techniques.js?v=v5"></script>
<script src="js/chat.js?v=v5"></script>
<script src="js/app.js?v=v5"></script>
</body>
</html>
